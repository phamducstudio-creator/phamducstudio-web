# Lưu thay đổi từ BẢNG SỬA ẢNH ẨN của thiệp mẫu (thiep-mau.html?m=<mẫu>&sua=1 → nút Lưu → GitHub "New issue" điền sẵn).
# Chỉ chạy với issue tiêu đề bắt đầu "[sua-thiep]" do CHÍNH CHỦ REPO tạo (người khác tạo issue sẽ không làm gì).
# Các bước: báo đã nhận → kiểm dữ liệu & sửa thiep-mau.html (.github/sua-thiep/ap_dung.py) → commit →
# chụp lại dải ảnh trang bán (chup_dai_anh.py) → commit → đợi web thật đổi → trả lời + đóng issue.
# Nhiều lần lưu chạy song song vẫn an toàn: đẩy lỗi thì lấy bản mới nhất trên main rồi áp lại yêu cầu (không mất lần lưu nào).
name: Sửa thiệp mẫu

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  sua:
    if: startsWith(github.event.issue.title, '[sua-thiep]') && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SO: ${{ github.event.issue.number }}
    steps:
      - name: Báo đã nhận
        run: gh issue comment "$SO" --repo "$GITHUB_REPOSITORY" --body "⏳ Đã nhận — đang cập nhật thiệp, khoảng 2–3 phút…" || true

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kiểm dữ liệu & sửa thiệp
        id: ap
        run: python3 .github/sua-thiep/ap_dung.py ap-dung "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/ket-qua.json"

      - name: Lưu lên web (commit thiệp)
        id: day
        if: steps.ap.outputs.doi == '1'
        env:
          MAU_KEY: ${{ steps.ap.outputs.key }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            if [ "$i" -gt 1 ]; then
              sleep $((i * 3))
              git fetch -q origin main && git reset -q --hard origin/main
              python3 .github/sua-thiep/ap_dung.py ap-dung "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/ket-qua.json" > /dev/null
            fi
            git add thiep-mau.html thiep-cuoi-online.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Thiệp mẫu ${MAU_KEY}: sửa ảnh từ bảng sửa ẩn (#${SO})"
            if git push -q origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Chụp lại dải ảnh ở trang bán
        id: dai
        if: steps.day.outcome == 'success'
        continue-on-error: true
        env:
          MAU_KEY: ${{ steps.ap.outputs.key }}
        run: |
          python3 -m pip install -q playwright pillow
          python3 .github/sua-thiep/chup_dai_anh.py "$MAU_KEY"
          git add images/thiep-mau-*.webp thiep-cuoi-online.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Trang bán thiệp: chụp lại dải ảnh mẫu ${MAU_KEY} (#${SO})"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          exit 1

      - name: Đợi web đổi
        id: web
        if: steps.day.outcome == 'success'
        run: python3 .github/sua-thiep/ap_dung.py cho-web "$RUNNER_TEMP/ket-qua.json"

      - name: Trả lời & đóng issue
        if: always()
        run: |
          python3 .github/sua-thiep/ap_dung.py bao "$RUNNER_TEMP/ket-qua.json" "${{ steps.ap.outcome }}" "${{ steps.day.outcome }}" "${{ steps.dai.outcome }}" "${{ steps.web.outcome }}" > "$RUNNER_TEMP/tra-loi.md" \
            || echo "❌ Có lỗi khi xử lý — thiệp trên web chưa đổi. Nhắn Claude kiểm tra giúp." > "$RUNNER_TEMP/tra-loi.md"
          gh issue comment "$SO" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/tra-loi.md"
          gh issue close "$SO" --repo "$GITHUB_REPOSITORY" || true
